name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['24', '26']
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pinned pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          check-latest: true
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies and build with the pinned toolchain
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Check the test runtime
        env:
          EXPECTED_NODE_MAJOR: ${{ matrix.node }}
        run: |
          node --input-type=module -e "if (process.versions.node.split('.')[0] !== process.env.EXPECTED_NODE_MAJOR) throw new Error('Wrong test runtime: ' + process.version)"

      - name: Run Node unit and CLI tests
        if: matrix.node == '24'
        run: node scripts/test-node.ts

      - name: Require Chrome for browser tests
        if: matrix.node == '26'
        run: |
          chrome_path="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$chrome_path" ] || [ ! -x "$chrome_path" ]; then
            echo '::error::Browser tests require Chrome. Install it and set CHROME_PATH.'
            exit 1
          fi
          "$chrome_path" --version
          echo "CHROME_PATH=$chrome_path" >> "$GITHUB_ENV"

      - name: Run all tests with coverage and run the packed package
        if: matrix.node == '26'
        run: |
          node node_modules/c8/bin/c8.js node --test tests/*.test.ts
          node scripts/pack-and-test.ts

      - name: Upload coverage report
        if: ${{ always() && matrix.node == '26' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: |
            coverage/lcov.info
            coverage/lcov-report/
            coverage/coverage-summary.json
          if-no-files-found: warn
          retention-days: 7

  check:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pinned pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check shrinkwrap, format, lint and types
        run: pnpm check:static

  bench:
    name: Benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pinned pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate a synthetic repository of 3,000 modules
        run: node scripts/synthetic-repo.ts "$RUNNER_TEMP/synthetic" --modules 3000

      - name: Benchmark against the speed targets
        shell: bash
        run: pnpm --silent bench "$RUNNER_TEMP/synthetic" --check | tee "$RUNNER_TEMP/bench.txt"

      - name: Write the results to the job summary
        if: always()
        shell: bash
        run: |
          {
            echo '```text'
            cat "$RUNNER_TEMP/bench.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
