name: Release Galactica

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified archive with npm trusted publishing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: galactica-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      artifact-id: ${{ steps.candidate.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - run: pnpm install --frozen-lockfile

      - run: pnpm release:prepare
        env:
          RELEASE_PUBLISH: ${{ inputs.publish }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: candidate
        with:
          name: galactica-${{ github.sha }}-${{ github.run_attempt }}
          path: release/
          if-no-files-found: error

  publish:
    if: ${{ inputs.publish && github.repository == 'cognitap/galactica' && github.ref == 'refs/heads/main' }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.11.1'

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact-id }}
          path: release/

      - name: Publish and verify the prepared archive
        run: |
          version=$(jq -er .version release/release.json)
          expected=$(jq -er .integrity release/release.json)
          for attempt in {0..30}; do
            if published=$(curl -fsS --max-time 10 -H 'Cache-Control: no-cache' "https://registry.npmjs.org/@cognitap%2Fgalactica/$version" | jq -er .dist.integrity); then
              if [ "$published" != "$expected" ]; then
                echo 'Registry integrity differs from the release archive.' >&2
                exit 1
              fi
              echo "Verified @cognitap/galactica@$version."
              exit 0
            fi
            if [ "$attempt" -eq 0 ]; then
              # An upload can succeed even when the publish command fails.
              npm publish release/galactica.tgz --ignore-scripts --provenance --access public --tag latest --registry https://registry.npmjs.org/ || echo 'Publish returned an error; checking npm.'
            else
              sleep 5
            fi
          done
          echo "Could not verify @cognitap/galactica@$version after 30 registry checks." >&2
          exit 1
